<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>natalie trono</title>
  <meta name="description" content="natalie trono">
  <meta name="theme-color" content="#f8f6f5">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png?v=2">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f8f6f5;
      --ink: #1c1b1b;
      --quiet: #6a6a6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: normal;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1 {
      font-size: inherit;
      font-weight: inherit;
    }

    a {
      color: var(--quiet);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover,
    a:focus-visible { color: var(--ink); }

    a:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 4px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 20px;
      margin-top: 4px;
    }

    .glint {
      position: fixed;
      pointer-events: none;
      background: linear-gradient(135deg, #dfe3e8, #8b939e 55%, #5f6772);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      animation: glint 800ms ease-out forwards;
    }

    @keyframes glint {
      from { opacity: 0.95; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3) rotate(90deg); }
    }
  </style>
</head>
<body>
  <h1>natalie trono</h1>

  <nav aria-label="Links">
    <a href="mailto:natalie.trono@gmail.com">email</a>
    <a href="https://www.linkedin.com/in/natalie-trono/">linkedin</a>
    <a href="https://x.com/Natalie_Trono">twitter</a>
  </nav>

  <script>
    (() => {
      if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      let lastX = 0, lastY = 0, live = 0;
      addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse" || live > 40) return;
        if (Math.hypot(e.clientX - lastX, e.clientY - lastY) < 10) return;
        lastX = e.clientX;
        lastY = e.clientY;
        const g = document.createElement("i");
        const size = 5 + Math.random() * 4;
        g.className = "glint";
        g.style.width = g.style.height = size + "px";
        g.style.left = e.clientX + 6 + (Math.random() - 0.5) * 12 + "px";
        g.style.top = e.clientY + 12 + (Math.random() - 0.5) * 12 + "px";
        g.style.setProperty("--dx", (Math.random() - 0.5) * 12 + "px");
        g.style.setProperty("--dy", 8 + Math.random() * 10 + "px");
        live++;
        g.addEventListener("animationend", () => { g.remove(); live--; });
        document.body.append(g);
      });
    })();
  </script>
</body>
</html>
