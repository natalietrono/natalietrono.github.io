<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>natalie trono</title>
  <meta name="description" content="natalie trono">
  <meta name="theme-color" content="#f8f6f5">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #f8f6f5;
      --ink: #1c1b1b;
      --quiet: #6a6a6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: normal;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1 {
      font-size: inherit;
      font-weight: inherit;
    }

    a {
      color: var(--quiet);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover,
    a:focus-visible { color: var(--ink); }

    a:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 4px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 20px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>natalie trono</h1>

  <nav aria-label="Links">
    <a href="mailto:natalie.trono@gmail.com">email</a>
    <a href="https://www.linkedin.com/in/natalie-trono/">linkedin</a>
    <a href="https://x.com/Natalie_Trono">twitter</a>
  </nav>
</body>
</html>
